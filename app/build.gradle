android {
    namespace 'com.example.salty'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.salty"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Load signing values from env vars (GitHub Actions) or local gradle.properties
    def signingStoreFile = System.getenv("SIGNING_STORE_FILE") ?: project.findProperty("SIGNING_STORE_FILE")
    def signingStorePassword = System.getenv("SIGNING_STORE_PASSWORD") ?: project.findProperty("SIGNING_STORE_PASSWORD")
    def signingKeyAlias = System.getenv("SIGNING_KEY_ALIAS") ?: project.findProperty("SIGNING_KEY_ALIAS")
    def signingKeyPassword = System.getenv("SIGNING_KEY_PASSWORD") ?: project.findProperty("SIGNING_KEY_PASSWORD")

    signingConfigs {
        release {
            if (signingStoreFile != null) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // THIS is the key part for real signed release
            signingConfig signingConfigs.release

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
